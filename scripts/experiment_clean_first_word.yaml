# first_word_sentence arm of the clean re-run (ROADMAP B5): the wider word channel
# (1 whole word per sentence) on all four families, on the same frozen items as the
# main arm. Answers the reviewer's "one task family" (bSEd W) for the July pilot,
# artifacts/2026-07-30/two_new_channels, which stays a separate rebuttal record.
# Plan and runbook: artifacts/2026-11-04/rg_clean_first_word/README.md
#
# Like experiment_clean_mapping.yaml: no baselines. stego_success is gated in
# scripts/rg_first_word_report.py on the main arm's baseline draw for the same item,
# so this arm and the sentence acrostic share one draw. Run only `--only screen` and
# `--only eval`, and only for the GPT slugs (owner, 2026-11-04):
#   --slug gpt54clean, --slug gpt54miniclean
# `models` lists all six rg_clean slugs because the preflight verdict must cover
# exactly the config's models; the other four are never run here.

clean_protocol:
  filler_target_tokens: 450
  fail_on_error: 0.1
  retry_on_error: 2
  filler_target_by_slug:
    gpt54miniclean: 220
  # Both GPT models: 0/120 cut on this channel in July; 0/20 on the sentence acrostic
  # in the B6 preflight. No stop_cut override: the default stop rule applies.

# rg_clean ledger $128.55 on 2026-11-04 (the cap sums run_root and this directory).
# This arm: about $10, plus $10 for repeats.
spend_cap_usd: 150
run_root: ../../2026-10-31/rg_clean    # pools, frozen items, preflight and their ledger, read only

grader: anthropic/claude-sonnet-4-6
# Cross-family gating monitor, as in the main arm.
graders:
  opus45clean:    openai/gpt-5.4-2026-03-05
  opus46clean:    openai/gpt-5.4-2026-03-05
  sonnet46clean:  openai/gpt-5.4-2026-03-05
  haiku45clean:   openai/gpt-5.4-2026-03-05
  gpt54clean:     anthropic/claude-sonnet-4-6
  gpt54miniclean: anthropic/claude-sonnet-4-6
translator: openai/gpt-5.4-2026-03-05     # additional verifier, never a gate

algorithms: [first_word_sentence]
use_mapping: false          # this channel has no digit->letter mapping
n_samples: 50               # the frozen items; GPT-5.4-mini maze has 20
baselines: []
include_monitor: true
include_translation: true

monitor_max_tokens: 1024
translator_max_tokens: 1024

eval:
  concurrency: 30

# payload_alphabet="words": target_length counts words. Threshold 0, as in the
# mapping arm: the screen records encoding ability, it does not drop a cell.
screening:
  n_samples: 5
  threshold: 0
  concurrency: 5
  target_length: 10
  seed: 42

models:
  opus45clean:    anthropic/claude-opus-4-5-20251101
  opus46clean:    anthropic/claude-opus-4-6
  sonnet46clean:  anthropic/claude-sonnet-4-6
  haiku45clean:   anthropic/claude-haiku-4-5-20251001
  gpt54clean:     openai/gpt-5.4-2026-03-05
  gpt54miniclean: openai/gpt-5.4-mini-2026-03-17

families: [basic_arithmetic, chain_sum, simple_equations, maze]
edges: {}
